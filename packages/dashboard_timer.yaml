# Dashboard timer
#
# One countdown for the calendar kiosk. A parent starts it from the timer
# controls (the `timer_controls` streamline template, in the parents
# dashboard and the kiosk's `#parents` pop-up). While it runs, the kiosk's
# photo frame gives way to a 60-minute dial (`timer-face-card`). When it
# finishes, the dial holds at zero, red, until someone taps it; then every
# dashboard goes back to normal.
# The dial chimes in the browser when a countdown starts and at each five
# minutes left; nothing here plays a sound when it finishes, so an automation
# can announce that on the house's speakers.
#
# Entities:
#   timer.dashboard                        the countdown itself
#   input_text.dashboard_timer_label       what the countdown is for, shown
#                                          above the readout
#   input_boolean.dashboard_timer_shown    on while the dial should be on
#                                          screen: from start to acknowledged
#   script.dashboard_timer_start           set the label and start, in one call
#   script.dashboard_timer_pause_toggle    pause when active, resume when paused
#
# The label is free text so an automation can say anything ("Homework",
# "Screen time ends"). It is cleared when the dial goes, on cancel or on
# acknowledgement, so a stale label never heads the next countdown. Set it
# before or after starting, either order works.
#
# One countdown starts on its own: "Ready for school", thirty minutes
# before the morning target (input_datetime.kid_morning_target, from the
# star jar package) on a school day (binary_sensor.kid_school_day, same
# package). The time trigger follows the helper, so tuning the target there
# moves this too. It yields to a countdown already going.
#
# The dial (`www/timer-face-card.js`) counts down in the browser from the
# timer's `finishes_at`, the way the tile card does, so nothing here ticks.
#
# `shown` is what the dashboards watch. It goes on with `timer.started` and
# again with `timer.finished` (so a finished timer always shows Done, even if
# someone switched it off mid-count), off with `timer.cancelled`, and off
# when the card is tapped on the finished screen. Done, to the card, is
# `shown` on with the timer idle.

timer:
  dashboard:
    name: Dashboard Timer
    icon: mdi:timer-outline
    duration: "00:10:00"
    restore: true

input_text:
  dashboard_timer_label:
    name: Dashboard Timer Label
    icon: mdi:label-outline
    max: 24

input_boolean:
  dashboard_timer_shown:
    name: Dashboard Timer Shown
    icon: mdi:timer-check-outline

automation:
  - alias: "Dashboard Timer: School Countdown"
    id: dashboard_timer_school_morning
    description: Starts a thirty-minute "Ready for school" countdown that ends at the morning target.
    mode: single
    triggers:
      - trigger: time
        at:
          entity_id: input_datetime.kid_morning_target
          offset: "-00:30:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.kid_school_day
        state: "on"
      # A countdown a parent already has going, running or paused, is theirs.
      - condition: state
        entity_id: timer.dashboard
        state: idle
    actions:
      - action: script.dashboard_timer_start
        data:
          label: Ready for school
          duration: "00:30:00"

  - alias: "Dashboard Timer: Clear Label"
    id: dashboard_timer_clear_label
    description: Blanks the label when the dial goes, unless a new countdown has already started.
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.dashboard_timer_shown
        from: "on"
        to: "off"
    conditions:
      - condition: state
        entity_id: timer.dashboard
        state: idle
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.dashboard_timer_label
        data:
          value: ""

  - alias: "Dashboard Timer: Show and Hide"
    id: dashboard_timer_shown
    description: Puts the dial on the dashboards when the timer starts or finishes, and takes it off on cancel. Acknowledging the finished screen (a tap on the dial) takes it off too.
    mode: queued
    triggers:
      - trigger: event
        event_type: timer.started
        event_data:
          entity_id: timer.dashboard
        id: "on"
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.dashboard
        id: "on"
      - trigger: event
        event_type: timer.cancelled
        event_data:
          entity_id: timer.dashboard
        id: "off"
    actions:
      - action: "input_boolean.turn_{{ trigger.id }}"
        target:
          entity_id: input_boolean.dashboard_timer_shown

script:
  # A dashboard button performs one action, so this is how a button starts
  # a labelled countdown. Automations use it for the same reason.
  dashboard_timer_start:
    alias: "Dashboard Timer: start with a label"
    icon: mdi:timer-play-outline
    description: Sets the label and starts the dashboard timer for the given duration, restarting it if it is already running.
    fields:
      label:
        description: What the countdown is for, shown above the readout. Leave empty for none.
        example: Homework
        selector:
          text:
      duration:
        description: How long, as hh:mm:ss.
        required: true
        example: "00:20:00"
        selector:
          text:
    sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.dashboard_timer_label
        data:
          value: "{{ label | default('') }}"
      - action: timer.start
        target:
          entity_id: timer.dashboard
        data:
          duration: "{{ duration }}"

  dashboard_timer_pause_toggle:
    alias: "Dashboard Timer: pause or resume"
    icon: mdi:play-pause
    description: Pauses the dashboard timer if it is running, resumes it if it is paused, and does nothing when it is idle.
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: timer.dashboard
                state: active
            sequence:
              - action: timer.pause
                target:
                  entity_id: timer.dashboard
          - conditions:
              - condition: state
                entity_id: timer.dashboard
                state: paused
            sequence:
              - action: timer.start
                target:
                  entity_id: timer.dashboard
