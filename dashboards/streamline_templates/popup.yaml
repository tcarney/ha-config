# Pop-up
#
# The Bubble Card pop-up chrome, so a pop-up is three lines of intent instead
# of twenty of settings. Only the hash, the title and the contents change
# between most pop-ups.
#
#   - type: custom:streamline-card
#     template: popup
#     variables:
#       hash: "#alarm-perimeter"
#       name: Doors and Windows
#       cards:
#         - type: custom:auto-entities
#           ...
#
# Required variables:
#   hash    the fragment that opens it, e.g. "#alarm-perimeter".
#   name    title shown in the pop-up header
#   cards   list of cards making up the body
#
# Optional:
#   width       desktop width; phones are full width regardless
#   popup_mode  "default", or "centered" to sit in the middle of the screen
#   trigger        conditions that open the pop-up on their own, as the
#                  doorbell does when the button is pressed
#   trigger_close  close it again when those conditions stop holding
#   auto_close     milliseconds of inactivity before it closes, default 30000
#
# `cards` is a list, and streamline handles that: a variable whose value is
# an object replaces the quoted "[[cards]]" token wholesale, so the array
# survives. Scalars are substituted inside the quotes instead. That is why
# every scalar token below has to stay quoted.
#
# `button_type: name` because these pop-ups carry no entity. `state` would
# only change the defaults for showing state and attributes, both of which
# need an entity to render anything.
#
# `trigger` defaults to null rather than an empty list. Bubble Card reads it
# as `if (!trigger) return null`, so null takes exactly the same path as the
# key being absent; an empty list is truthy and returns early instead, which
# would skip the older trigger_entity/trigger_state handling below it.
#
# `trigger_close` defaults to null for the same reason: streamline substitutes
# scalars inside the quotes, so a default of `false` would reach Bubble Card
# as the string "false", which is truthy. Pass `true` to turn it on.

default:
  width: 540px
  popup_mode: default
  trigger: null
  trigger_close: null
  auto_close: "30000"

card:
  type: custom:bubble-card
  card_type: pop-up
  hash: "[[hash]]"
  name: "[[name]]"
  button_type: name
  width_desktop: "[[width]]"
  popup_mode: "[[popup_mode]]"
  backdrop_blur: "5"
  auto_close: "[[auto_close]]"
  popup_style: classic
  buttons_position: left
  show_header: true
  show_name: true
  show_icon: false
  button_action:
    tap_action:
      action: none
  tap_action:
    action: none
  sub_button:
    main: []
    bottom: []
  trigger: "[[trigger]]"
  trigger_close: "[[trigger_close]]"
  cards: "[[cards]]"
