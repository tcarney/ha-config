# Weather detail panel
#
# Current conditions with a large animated icon and a five-day forecast, as
# one Bubble Card. The sub-button row shows conditions, apparent temperature,
# and a sunrise/sunset countdown that switches to a UV warning above the
# configured threshold. Tapping today swaps the whole card for a graph of the
# next 24 hours.
#
# Self-contained: drop it in a view, a section, or a bubble-card pop-up. It
# needs `/local/forecast-graph-card.js` registered as a module resource.
#
# The forecast drops the unit letter from temperatures ("59°", not "59 °F"),
# matching the weather more-info dialog. The module appends the unit with no
# option to hide it, so the trim lives in the card's `styles` as a
# MutationObserver rather than in the module file, which keeps module
# updates drop-in.
#
# The card pins the container to 250px and the bottom sub-button row to
# 110px from the bottom on purpose. Bubble Weather v1.2.0 positions that row
# itself, just above the forecast strip; the fixed values keep it up near the
# header instead.
#
# The graph shows temperature, colored by band, over chance of
# precipitation. Touch or drag to read an hour; the close button swaps the
# weather card back. The graph is `config/www/forecast-graph-card.js`, which
# wraps the weather card and takes its 250px height when it opens; its
# header has the details. The module sets `pointer-events: none` on the
# whole forecast strip, so the styles turn them back on for today's cell;
# otherwise taps fall through to the button underneath.
#
#   - type: custom:streamline-card
#     template: weather_detail
#     variables:
#       weather_entity: weather.your_weather
#       conditions_entity: sensor.your_weather_conditions
#       feels_like_entity: sensor.your_weather_feels_like
#       sun_event_entity: sensor.sun_status
#
# Note:
#   The conditions, feels_like, and sun_event entities are all built as text
#   summaries in `config/packages/status_sensors.yaml`.  This handles reuse in
#   multiple dashboard cards.
#
# Required variables:
#   weather_entity      weather entity driving the icon, temperature, forecasts
#   conditions_entity   text summary for the first sub-button
#   feels_like_entity   text summary for the second sub-button
#   sun_event_entity    text summary for the third sub-button; countdown to the
#                       next sunrise/sunset, elevating to a UV warning when the
#                       index is high
#
# Optional:
#   icon_path      where the condition SVGs live; this repo ships a set under
#                  `config/www/weather_icons/` (served from `/local/`)

default:
  icon_path: /local/weather_icons

card:
  type: custom:forecast-graph-card
  entity: "[[weather_entity]]"
  card:
    type: custom:bubble-card
    card_type: button
    button_type: state
    entity: "[[weather_entity]]"
    show_icon: true
    icon: none
    show_name: false
    state_content: temperature
    scrolling_effect: true
    modules:
      - weather_forecast
    weather_forecast:
      type: daily
      max_days: 5
      hide_icon_background: true
      card_layout: default
      disable_dynamic_background: true
    sub_button:
      main: []
      bottom:
        - name: Conditions
          entity: "[[conditions_entity]]"
          show_icon: false
          show_state: true
          show_background: false
          tap_action:
            action: none
        - name: Feels Like
          entity: "[[feels_like_entity]]"
          show_name: false
          show_state: true
          show_background: false
          tap_action:
            action: none
        - entity: "[[sun_event_entity]]"
          show_name: false
          show_state: true
          show_background: false
          tap_action:
            action: none
    styles: >-
      .bubble-icon-container {
        margin-left: 40px !important;
      }

      .bubble-icon {
        --mdc-icon-size: 100px !important;
        background-size: cover;
        background-image: url("[[icon_path]]/{{ 'partly-cloudy-night' if is_state(entity, 'partlycloudy') and is_state('sun.sun', 'below_horizon') else states(entity) }}.svg");
      }

      .bubble-name-container {
        line-height: 100px;
        flex-direction: unset;
      }

      .bubble-state {
        font-size: 42px;
        font-weight: 680;
      }

      .bubble-button-card-container {
        min-height: 250px !important;
      }

      .bubble-container.bc-weather-card
      .bubble-sub-button-bottom-container {
        bottom: 110px !important;
      }

      .bubble-sub-button-group {
        gap: 4px !important;
      }

      .bubble-sub-button {
        padding: 0;
      }

      .bubble-background {
        background-color: var(--ha-card-background, var(--card-background-color, #1c1c1c)) !important;
      }

      .bc-weather-grid > .bc-weather-day:first-child {
        pointer-events: auto;
        cursor: pointer;
      }

      ${(() => {
        const host = this?.elements?.cardWrapper || card;
        if (!host) return '';
        const fix = () => host.querySelectorAll('.bc-weather-day .hi, .bc-weather-day .lo').forEach(el => {
          const t = el.textContent;
          const s = t.replace(/\s*°[FC]$/, '°');
          if (s !== t) el.textContent = s;
        });
        if (!host._wxLabelObserver) {
          host._wxLabelObserver = new MutationObserver(fix);
          host._wxLabelObserver.observe(host, { childList: true, characterData: true, subtree: true });
        }
        fix();
        return '';
      })()}
    tap_action:
      action: none
    button_action:
      tap_action:
        action: none
      hold_action:
        action: none
