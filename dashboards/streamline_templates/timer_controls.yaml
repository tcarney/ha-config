# Timer controls
#
# The parent side of the dashboard timer: what is left, pause or resume,
# cancel, a labelled homework countdown, and four preset starts. One
# vertical stack, so the same YAML backs the parents dashboard and the
# kiosk's `#parents` pop-up.
#
#   - type: custom:streamline-card
#     template: timer_controls
#
# No variables: there is one dashboard timer, like the package behind it.
#
# The countdown tile shows the timer's own live countdown, which the
# frontend renders for timer entities without any help. The start options
# are one entities card of button rows. A preset pressed while a countdown
# is running restarts it at the new duration. The homework button goes through the package's
# start script, since a button performs one action and that one sets the
# label too. Cancel does confirm.

card:
  type: vertical-stack
  cards:
    - type: heading
      icon: mdi:timer-outline
      heading: Timer
      heading_style: title
    - type: grid
      columns: 3
      square: false
      cards:
        - type: tile
          entity: timer.dashboard
          name: Countdown
          tap_action:
            action: more-info
          vertical: true
        - type: button
          name: Pause / Resume
          icon: mdi:play-pause
          icon_height: 30px
          tap_action:
            action: perform-action
            perform_action: script.dashboard_timer_pause_toggle
        - type: button
          name: Cancel
          icon: mdi:timer-off-outline
          icon_height: 30px
          tap_action:
            action: perform-action
            perform_action: timer.cancel
            target:
              entity_id: timer.dashboard
            confirmation:
              text: Cancel the timer?
    - type: entities
      entities:
        - type: button
          name: 15 min homework timer
          icon: mdi:book-clock-outline
          action_name: Start
          tap_action:
            action: perform-action
            perform_action: script.dashboard_timer_start
            data:
              label: Homework
              duration: "00:15:00"
        - type: button
          name: 5 min
          icon: mdi:clock-time-one-outline
          action_name: Start
          tap_action:
            action: perform-action
            perform_action: timer.start
            target:
              entity_id: timer.dashboard
            data:
              duration: "00:05:00"
        - type: button
          name: 10 min
          icon: mdi:clock-time-two-outline
          action_name: Start
          tap_action:
            action: perform-action
            perform_action: timer.start
            target:
              entity_id: timer.dashboard
            data:
              duration: "00:10:00"
        - type: button
          name: 30 min
          icon: mdi:clock-time-six-outline
          action_name: Start
          tap_action:
            action: perform-action
            perform_action: timer.start
            target:
              entity_id: timer.dashboard
            data:
              duration: "00:30:00"
        - type: button
          name: 60 min
          icon: mdi:clock-time-twelve-outline
          action_name: Start
          tap_action:
            action: perform-action
            perform_action: timer.start
            target:
              entity_id: timer.dashboard
            data:
              duration: "01:00:00"
