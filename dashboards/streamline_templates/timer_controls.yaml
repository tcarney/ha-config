# Timer controls
#
# The parent side of the dashboard timer: what is left, four preset starts,
# pause or resume, cancel. One vertical stack, so the same YAML backs the
# parents dashboard and the kiosk's `#parents` pop-up.
#
#   - type: custom:streamline-card
#     template: timer_controls
#
# No variables: there is one dashboard timer, like the package behind it.
#
# The tile shows the timer's own live countdown, which the frontend renders
# for timer entities without any help. A preset pressed while a countdown is
# running restarts it at the new duration; there is no confirmation because
# that is the quickest way to change your mind. Cancel does confirm.

card:
  type: vertical-stack
  cards:
    - type: heading
      icon: mdi:timer-outline
      heading: Timer
      heading_style: title
    - type: tile
      entity: timer.dashboard
      name: Countdown
      tap_action:
        action: more-info
    - type: grid
      columns: 4
      square: false
      cards:
        - type: button
          name: 5 min
          icon: mdi:clock-time-one-outline
          icon_height: 20px
          tap_action:
            action: perform-action
            perform_action: timer.start
            target:
              entity_id: timer.dashboard
            data:
              duration: "00:05:00"
        - type: button
          name: 10 min
          icon: mdi:clock-time-two-outline
          icon_height: 20px
          tap_action:
            action: perform-action
            perform_action: timer.start
            target:
              entity_id: timer.dashboard
            data:
              duration: "00:10:00"
        - type: button
          name: 30 min
          icon: mdi:clock-time-six-outline
          icon_height: 20px
          tap_action:
            action: perform-action
            perform_action: timer.start
            target:
              entity_id: timer.dashboard
            data:
              duration: "00:30:00"
        - type: button
          name: 60 min
          icon: mdi:clock-time-twelve-outline
          icon_height: 20px
          tap_action:
            action: perform-action
            perform_action: timer.start
            target:
              entity_id: timer.dashboard
            data:
              duration: "01:00:00"
    - type: grid
      columns: 2
      square: false
      cards:
        - type: button
          name: Pause / Resume
          icon: mdi:play-pause
          icon_height: 30px
          tap_action:
            action: perform-action
            perform_action: script.dashboard_timer_pause_toggle
        - type: button
          name: Cancel
          icon: mdi:timer-off-outline
          icon_height: 30px
          tap_action:
            action: perform-action
            perform_action: timer.cancel
            target:
              entity_id: timer.dashboard
            confirmation:
              text: Cancel the timer?
