# Lock with door
#
# A Bubble Card button for a lock that also shows whether its door is open.
# The icon takes the lock's state colour and "Open" is appended to the state
# while the door is open. The lock and unlock sub-buttons appear only while
# the door is closed, so a lock is never thrown against an open door.
#
#   - type: custom:streamline-card
#     template: lock_with_door
#     variables:
#       lock_entity: lock.front_door
#       door_sensor: binary_sensor.front_door
#
# Required variables:
#   lock_entity   the lock
#   door_sensor   the door's opening sensor
card:
  type: custom:bubble-card
  card_type: button
  button_type: state
  entity: "[[lock_entity]]"
  show_state: true
  tap_action:
    action: none
  button_action:
    tap_action:
      action: none
  sub_button:
    main:
      - icon: mdi:door-open
        show_background: false
        tap_action:
          action: none
        visibility:
          - condition: state
            entity: "[[door_sensor]]"
            state: "on"
        name: Open
      - icon: mdi:lock
        show_background: true
        state_background: false
        tap_action:
          action: call-service
          service: lock.lock
          target:
            entity_id: "[[lock_entity]]"
        visibility:
          - condition: state
            entity: "[[door_sensor]]"
            state: "off"
          - condition: state
            entity: "[[lock_entity]]"
            state: unlocked
        name: Lock
      - icon: mdi:lock-open-variant
        show_background: true
        state_background: false
        tap_action:
          action: call-service
          service: lock.unlock
          target:
            entity_id: "[[lock_entity]]"
        visibility:
          - condition: state
            entity: "[[door_sensor]]"
            state: "off"
          - condition: state
            entity: "[[lock_entity]]"
            state: locked
        name: Unlock
  styles: |
    .bubble-state::after {
      content: "${hass.states['[[door_sensor]]'].state === 'on' ? ',\\a0 Open' : ''}";
    }
    .bubble-icon {
      color: var(--state-lock-${hass.states['[[lock_entity]]'].state}-color, var(--state-icon-color)) !important;
    }
    .bubble-sub-button {
      width: 105px !important;
    }
