# Timer face
#
# A 60-minute dial for the dashboard timer, drawn the way a kitchen timer
# is: marks and labels clockwise from 0 at the top like a clock, a wedge
# from 0 round to the minute that is left so it drains counter-clockwise as
# time passes, and the mm:ss readout in the middle. The readout is the only
# text: paused is a wedge that stops moving, and done is the readout disc
# turning red. It fills whatever height it is given and stays square, so put
# it in a tall grid slot.
#
#   - type: custom:streamline-card
#     template: timer_face
#     grid_options:
#       columns: full
#       rows: 9
#
# Optional variables, with their defaults:
#   timer_entity      timer.dashboard
#   remaining_entity  sensor.dashboard_timer_remaining
#   done_entity       binary_sensor.dashboard_timer_done
#
# One markdown card does all of it, so no custom card is involved. The card
# itself is the backing disc, squared off and rounded. It is painted with
# `!important` because the markdown card's own `text_only` styling clears
# the background at higher specificity. It is not fully opaque, so the
# photo frame it replaces still shows through. The readout is the card's
# content. The dial is the two pseudo-elements card-mod paints on the card.
# The face is `www/dashboard_timer_face.svg` used as a mask over a theme
# colour, so the marks follow the theme and the SVG stays a single black
# shape. The labels in that SVG are traced to paths, because an SVG used as
# a CSS mask cannot load the page's font. The wedge is a conic gradient
# whose angle is a Jinja expression of the remaining sensor. Both re-render
# whenever that sensor changes, once a second while the timer runs, so
# nothing in the browser has to tick.
#
# The wedge is sized to cover the marks and stop short of the labels. That
# boundary comes from the SVG's geometry, so the two change together. The
# wedge reaches the centre, so the readout needs its own ground: a disc that
# inverts the dial, the marks' colour softened towards the card background
# with the card background as its digits, so it reads as one object with the
# face whatever the theme. The wedge is translucent for the same reason, so
# the marks under it stay visible.
#
# Needs card-mod.

default:
  timer_entity: timer.dashboard
  remaining_entity: sensor.dashboard_timer_remaining
  done_entity: binary_sensor.dashboard_timer_done

card:
  type: markdown
  text_only: true
  content: |-
    {% set left = states('[[remaining_entity]]') | int(0) %}
    # {{ '%02d:%02d' | format(left // 60, left % 60) }}
  card_mod:
    style:
      .: |
        ha-card {
          position: relative;
          height: 100%;
          min-height: 320px;
          aspect-ratio: 1 / 1;
          margin: 0 auto;
          box-sizing: border-box;
          display: grid;
          place-items: center;
          overflow: hidden;
          border-radius: 50%;
          background: color-mix(in srgb, var(--card-background-color) 70%, transparent) !important;
        }
        ha-card::before,
        ha-card::after {
          content: "";
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          aspect-ratio: 1 / 1;
          pointer-events: none;
        }
        ha-card::before {
          height: 80%;
          border-radius: 50%;
          background: conic-gradient(
            color-mix(in srgb, var(--primary-color) 70%, transparent) 0deg {{ (states('[[remaining_entity]]') | int(0) / 10) | round(2) }}deg,
            transparent {{ (states('[[remaining_entity]]') | int(0) / 10) | round(2) }}deg 360deg);
        }
        ha-card::after {
          height: 100%;
          background-color: var(--secondary-text-color);
          -webkit-mask: url(/local/dashboard_timer_face.svg) center / contain no-repeat;
          mask: url(/local/dashboard_timer_face.svg) center / contain no-repeat;
        }
        ha-markdown {
          position: relative;
          z-index: 1;
        }
      ha-markdown$: |
        ha-markdown-element {
          display: grid;
          place-items: center;
          width: 150px;
          aspect-ratio: 1 / 1;
          border-radius: 50%;
          color: var(--card-background-color);
          {% if is_state('[[done_entity]]', 'on') and is_state('[[timer_entity]]', 'idle') %}
          background: var(--red-color, #e53935);
          {% else %}
          background: color-mix(in srgb, var(--secondary-text-color) 80%, var(--primary-color));
          {% endif %}
        }
        h1 {
          font-size: 42px !important;
          font-weight: 680 !important;
          font-variant-numeric: tabular-nums;
          line-height: 1;
          margin: 0;
          color: inherit;
        }
