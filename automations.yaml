- id: '1721868620338'
  alias: TV Downtime Control
  description: ''
  triggers:
  - entity_id:
    - input_boolean.tv_down_time
    from:
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.tv_down_time
        state: 'on'
      sequence:
      - if:
        - condition: state
          entity_id: media_player.family_room_tv
          state: playing
        then:
        - target:
            entity_id: remote.family_room_tv
          data:
            command: home
            num_repeats: 2
            delay_secs: 5
          action: remote.send_command
        alias: Go to Home if Family Room is Playing
      - alias: Go to Home if Basement is Playing
        if:
        - condition: state
          entity_id: media_player.basement_tv
          state: playing
        then:
        - data:
            command: home
            num_repeats: 2
            delay_secs: 5
          target:
            entity_id: remote.basement_tv
          action: remote.send_command
      - delay:
          hours: 0
          minutes: 0
          seconds: 10
          milliseconds: 0
      - target:
          entity_id:
          - remote.family_room_tv
          - remote.basement_tv
        data:
          command: suspend
        action: remote.send_command
      - delay:
          hours: 0
          minutes: 0
          seconds: 10
          milliseconds: 0
      - metadata: {}
        data: {}
        action: switch.turn_off
        target:
          entity_id:
          - switch.kasa_plug_four
          - switch.kasa_plug_three
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: light.fireplace
    - conditions:
      - condition: state
        entity_id: input_boolean.tv_down_time
        state: 'off'
      sequence:
      - metadata: {}
        data: {}
        action: switch.turn_on
        target:
          entity_id:
          - switch.kasa_plug_four
          - switch.kasa_plug_three
  mode: queued
  max: 10
