- id: '1650738674012'
  alias: 'Lights: Patio'
  description: Control string lights from patio
  triggers:
  - entity_id:
    - light.patio_lights
    alias: Patio Light
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: light.patio_lights
      state: 'on'
    then:
    - data: {}
      target:
        entity_id: light.outdoor_string_lights
      action: light.turn_on
  - if:
    - condition: state
      entity_id: light.patio_lights
      state: 'off'
    then:
    - data: {}
      target:
        entity_id: light.outdoor_string_lights
      action: light.turn_off
  mode: single
