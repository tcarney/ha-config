- id: '1767109151139'
  alias: 'Lights: Basement Door'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.basement_door
    from:
    - 'off'
    to:
    - 'on'
  conditions:
  - condition: state
    entity_id: light.basement_ceiling_lights
    state:
    - 'off'
  - condition: state
    entity_id: binary_sensor.basement_motion
    state:
    - 'off'
    for:
      hours: 0
      minutes: 3
      seconds: 30
  actions:
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.basement_ceiling_lights
    data: {}
  mode: single
